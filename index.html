<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4f1ea">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="抽样拍照">
<title>抽样拍照 · 取证归档</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<script>
/* 原生壳（APK）回调入口：必须在模块加载前就存在 */
window.__nativePending = {};
window.__nativeResolve = function (id, ok, payload) {
  var p = window.__nativePending[id];
  if (!p) return;
  delete window.__nativePending[id];
  if (ok) { p[0](payload); return; }
  var msg = '原生调用失败', code = '';
  if (typeof payload === 'string') {
    msg = payload;
  } else if (payload && typeof payload === 'object') {
    if (payload.message) msg = payload.message;
    if (payload.code) code = payload.code;
  }
  var err = new Error(msg);
  if (code) err.code = code;
  p[1](err);
};
</script>
</head>
<body>
<div id="app" class="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="sheet-root"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
